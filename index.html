<!doctype html>
<html lang="zh-CN">
<head>
<title>表情包读心测试</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: single narrow column, a "chat bubble" stage for the sticker, options as message replies below */
:root{
  --bg:#eef0f4; --surface:#ffffff; --ink:#1d2030; --muted:#6b7086; --line:#d9dce6;
  --accent:#e2533d; --accent-ink:#ffffff; --accent-soft:#fbe3de; --bubble:#95ec69; --bubble-ink:#163a09;
  --display:"ZCOOL XiaoWei","Songti SC","STSong",serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171f; --surface:#1f2230; --ink:#eceef5; --muted:#9a9fb5; --line:#30344a;
  --accent:#ff7a63; --accent-ink:#1a0d09; --accent-soft:#3a2420; --bubble:#3c7a2a; --bubble-ink:#e9ffe0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171f; --surface:#1f2230; --ink:#eceef5; --muted:#9a9fb5; --line:#30344a;
  --accent:#ff7a63; --accent-ink:#1a0d09; --accent-soft:#3a2420; --bubble:#3c7a2a; --bubble-ink:#e9ffe0; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:30px;margin:0;letter-spacing:.02em;text-wrap:balance}
.tabs{display:flex;gap:4px}
.tabs button{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--muted);padding:4px 12px;border-radius:999px;cursor:pointer}
.hdr-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
.lede{margin:0 0 16px;color:var(--muted)}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.btn{font:inherit;font-weight:500;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,.opt:focus-visible,.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.done{background:var(--accent)}
.meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stage{display:flex;justify-content:flex-start;padding:8px 0 4px}
.bubble{background:var(--bubble);border-radius:6px 16px 16px 16px;padding:14px;max-width:78%;position:relative}
.bubble img{display:block;width:200px;max-width:100%;height:auto;border-radius:6px}
.q{font-family:var(--display);font-size:20px;margin:6px 0 2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{font:inherit;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;min-width:0}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.opt.custom{grid-column:1/-1;display:flex;gap:8px;align-items:center;padding:6px 6px 6px 14px;cursor:text}
.opt.custom span{white-space:nowrap;color:var(--muted);font-size:13px}
.opt.custom input{border:0;background:transparent;padding:6px 4px}
.opt.custom input:focus{outline:none}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
.notice{font-size:13px;color:var(--muted);margin:0}
.err{color:var(--accent)}
.done-big{font-family:var(--display);font-size:26px;margin:0 0 6px}
/* results */
.stat{display:flex;gap:24px;flex-wrap:wrap;font-family:var(--mono);font-variant-numeric:tabular-nums}
.stat b{display:block;font-size:24px;font-family:var(--mono)}
.stat span{font-size:12px;color:var(--muted);font-family:var(--body)}
.item{display:grid;grid-template-columns:72px 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.item img{width:72px;height:72px;object-fit:contain;background:var(--bg);border-radius:8px}
.item h3{margin:0 0 6px;font-size:13px;font-family:var(--mono);color:var(--muted);font-weight:400}
.bar{display:grid;grid-template-columns:5.5em 1fr 2.2em;gap:8px;align-items:center;font-size:13px;margin:3px 0}
.bar .t{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent)}
.bar .n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.customs{margin:6px 0 0;font-size:13px;color:var(--muted)}
.customs q{color:var(--ink);quotes:"“" "”"}
@media (prefers-reduced-motion:no-preference){.bubble{animation:pop .28s ease-out}@keyframes pop{from{transform:scale(.92);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1 data-i18n="title">这个表情是什么意思？</h1>
    <div class="hdr-r">
      <nav class="tabs" aria-label="Language">
        <button id="lang-zh" aria-pressed="true">中文</button>
        <button id="lang-en" aria-pressed="false">EN</button>
      </nav>
    </div>
  </header>

  <!-- intro -->
  <section class="card" id="v-intro">
    <p class="lede" data-i18n="lede">接下来会出现 10 个表情包，每个都想象成是别人刚发给你的。选出你觉得它在表达的情绪，如果四个都不对，就写下你自己的理解。没有标准答案。</p>
    <label class="f" for="nick" data-i18n="nickLabel">怎么称呼你（可不填）</label>
    <input type="text" id="nick" maxlength="40" placeholder="比如：小周" data-i18n-ph="nickPh">
    <div class="row" style="margin-top:16px">
      <button class="btn" id="start" data-i18n="start">开始测试</button>
      <p class="notice" id="intro-note"></p>
    </div>
  </section>

  <!-- quiz -->
  <section class="card" id="v-quiz" hidden>
    <div class="meta"><span id="qnum">01 / 10</span><span data-i18n="sent">对方发来</span></div>
    <div class="progress" id="prog" style="margin-top:8px"></div>
    <div class="stage"><div class="bubble" id="bubble"><img id="sticker" alt="表情包"></div></div>
    <p class="q" data-i18n="q">你觉得 TA 现在的情绪是？</p>
    <div class="opts" id="opts"></div>
    <div class="row" style="margin-top:16px;justify-content:space-between">
      <p class="notice" id="hint" data-i18n="hint">选一个，或者在最后一栏写下你的理解</p>
      <button class="btn" id="next" disabled>下一题</button>
    </div>
  </section>

  <!-- done -->
  <section class="card" id="v-done" hidden>
    <p class="done-big" data-i18n="done">做完啦，谢谢你</p>
    <p class="notice" id="save-note">正在保存…</p>
    <div class="row" style="margin-top:16px"><button class="btn ghost" id="again" data-i18n="again">再做一轮</button></div>
  </section>

</div>

$("start").onclick=()=>{
  round=shuffle(STICKERS).slice(0,Math.min(PER_ROUND,STICKERS.length));
  idx=0;answers=[];startedAt=Date.now();sessionId=startedAt.toString(36)+Math.random().toString(36).slice(2,6);
  $("prog").innerHTML=round.map(()=>"<i></i>").join("");

};
let pick=null;
function renderQ(){
  const s=round[idx];pick=null;qStart=Date.now();
  $("qnum").textContent=String(idx+1).padStart(2,"0")+" / "+String(round.length).padStart(2,"0");
  [...$("prog").children].forEach((el,i)=>el.classList.toggle("done",i<idx));
  const img=$("sticker");img.removeAttribute("src");const want=idx;srcOf(s.id).then(u=>{if(idx===want)img.src=u});if(round[idx+1])srcOf(round[idx+1].id).then(u=>{if(u)(new Image()).src=u});
  const b=$("bubble");b.style.animation="none";b.offsetHeight;b.style.animation="";
  const order=shuffle(EMOTIONS).slice(0,4);s._shown=order;
  $("opts").innerHTML=order.map((o,i)=>`<button class="opt" id="opt-${i}" data-v="${o.replace(/"/g,"&quot;")}" aria-pressed="false">${emo(o)}</button>`).join("")+
    `<label class="opt custom" for="custom"><span>${t("customLabel")}</span><input type="text" id="custom" maxlength="60" placeholder="${t("customPh")}"></label>`;
  $("opts").querySelectorAll("button.opt").forEach(btn=>btn.onclick=()=>{
    $("custom").value="";pick={type:"option",value:btn.dataset.v};mark(btn);
  });
  $("custom").oninput=e=>{
    const v=e.target.value.trim();pick=v?{type:"custom",value:v}:null;mark(null);
  };
  $("custom").onkeydown=e=>{if(e.key==="Enter"&&pick)next()};
  $("next").textContent=idx===round.length-1?t("submit"):t("next");
  $("next").disabled=true;
}
function mark(btn){
  $("opts").querySelectorAll("button.opt").forEach(b=>b.setAttribute("aria-pressed",b===btn?"true":"false"));
  $("next").disabled=!pick;
}
$("next").onclick=next;
function next(){
  if(!pick)return;
  const s=round[idx];
  answers.push({sticker:s.id,shown:s._shown,choice:pick.value,custom:pick.type==="custom",ms:Date.now()-qStart});
  idx++;
  if(idx<round.length)renderQ();else finish();
}
async function finish(){
  show("done");
  const session={id:sessionId,nick:$("nick").value.trim(),startedAt:new Date(startedAt).toISOString(),
    finishedAt:new Date().toISOString(),lang,ua:navigator.userAgent,answers:answers.map(a=>({...a,orig:ORIG[a.sticker]||""}))};
  if(SCRIPT_URL.startsWith("PASTE")){note("save-note","saveFail","SCRIPT_URL");return}
  note("save-note","saving");
  try{
    await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(session)});
    note("save-note","saved");
  }catch(e){note("save-note","saveFail",e.message||"network")}
}
$("again").onclick=()=>show("intro");

$("lang-zh").onclick=()=>setLang("zh");$("lang-en").onclick=()=>setLang("en");
applyLang();

</script>
