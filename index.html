<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>聊天</title>
<style>
/* Layout: one phone-sized chat screen; header / message list / input bar / sticker panel stacked in a column */
:root{
  --page:#d6d6d6; --chat:#ededed; --bar:#f7f7f7; --line:#dcdcdc;
  --ink:#191919; --muted:#888; --mine:#95ec69; --theirs:#ffffff;
  --go:#07c160; --go-ink:#ffffff; --badge:#fa5151;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--go);outline-offset:2px}
[hidden]{display:none!important}
img{max-width:100%}

.phone{position:relative;height:100%;max-width:430px;margin:0 auto;background:var(--chat);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:600px) and (max-width:899px) and (min-height:700px){
  body{display:flex;align-items:center;justify-content:center}
  .phone{height:min(860px,94vh);width:400px;border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.18)}
}

/* header */
.top{flex:none;display:grid;grid-template-columns:64px 1fr 64px;align-items:center;height:calc(48px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);background:var(--chat);border-bottom:1px solid var(--line)}
.back{justify-self:start;padding-left:max(10px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:4px}
.back svg{width:22px;height:22px}
.unread{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#dcdcdc;color:#191919;font-size:12px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.ttl{text-align:center;font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{justify-self:end;margin-right:max(12px,env(safe-area-inset-right,0px));font-size:13px;color:#555;padding:4px 6px}

/* messages */
.chat{flex:1;overflow-y:auto;padding:12px max(12px,env(safe-area-inset-right,0px)) 16px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.time{align-self:center;font-size:12px;color:#b2b2b2;padding:2px 0}
.row{display:flex;gap:10px;align-items:flex-start;max-width:100%}
.row.me{flex-direction:row-reverse}
.av{flex:none;width:40px;height:40px;border-radius:5px;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:500}
.body{min-width:0;max-width:calc(100% - 100px);display:flex;flex-direction:column;gap:3px}
.row.me .body{align-items:flex-end}
.who{font-size:12px;color:var(--muted);padding-left:2px}
.bub{position:relative;background:var(--theirs);padding:9px 12px;border-radius:5px;line-height:1.45;font-size:16px;word-break:break-word;white-space:pre-wrap}
.bub::before{content:"";position:absolute;top:13px;left:-5px;border:6px solid transparent;border-left:0;border-right-color:var(--theirs);border-right-width:6px}
.row.me .bub{background:var(--mine)}
.row.me .bub::before{left:auto;right:-5px;border-right:0;border-left:6px solid var(--mine)}
.card{width:230px;max-width:100%;white-space:normal;display:flex;flex-direction:column;gap:6px}
.card b{font-weight:400;font-size:15px;line-height:1.4}
.card span{font-size:12px;color:var(--muted)}
.card .map{height:86px;border-radius:3px;background:repeating-linear-gradient(35deg,#e9efe6 0 14px,#dfe8db 14px 16px),#e9efe6;position:relative}
.card .map::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-14px 0 0 -7px;background:var(--badge);border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.stk{display:block;width:130px;max-width:100%;height:auto;border-radius:4px}
.typing{display:inline-flex;gap:4px;padding:13px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:#b8b8b8;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}

/* input bar */
.inbar{flex:none;display:flex;align-items:center;gap:8px;background:var(--bar);border-top:1px solid var(--line);padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.ic{flex:none;width:30px;height:30px;display:grid;place-items:center;color:#181818}
.ic svg{width:28px;height:28px}
.ic[aria-pressed="true"]{color:var(--go)}
.inbar input{flex:1;min-width:0;height:38px;border:0;border-radius:5px;background:#fff;padding:0 10px;font:inherit;color:var(--ink)}
.btn-send{flex:none;background:var(--go);color:var(--go-ink);font-size:14px;padding:7px 12px;border-radius:5px}

/* sticker panel: tap a sticker to send it */
.panel{flex:none;height:min(300px,40vh);background:var(--bar);border-top:1px solid var(--line);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.p-tabs{flex:none;display:flex;align-items:center;gap:6px;padding:6px max(10px,env(safe-area-inset-left,0px));border-bottom:1px solid #e6e6e6}
.p-tab{width:38px;height:30px;border-radius:5px;display:grid;place-items:center;color:#555}
.p-tab svg{width:22px;height:22px}
.p-tab.on{background:#e2e2e2;color:var(--ink)}
.p-space{flex:1}
.grid{flex:1;min-height:0;overflow-y:auto;display:flex;flex-wrap:wrap;align-content:flex-start;gap:10px;padding:10px max(12px,env(safe-area-inset-left,0px))}
.cell{position:relative;flex:none;width:calc((100% - 30px) / 4);aspect-ratio:1/1;border-radius:6px;background:#fff;overflow:hidden}
.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cell:active{background:#e4e4e4}

/* incoming-message banner, used to move to the next chat */
.banner{position:absolute;z-index:6;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:center;text-align:left;background:rgba(250,250,250,.97);border-radius:14px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.16);transform:translateY(-140%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.banner.show{transform:none}
.banner .av{width:38px;height:38px}
.av{overflow:hidden}
.av img{display:block;width:100%;height:100%;object-fit:cover}
.banner .bt{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.banner b{font-size:15px;font-weight:600}
.banner span{font-size:14px;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner small{align-self:flex-start;font-size:12px;color:var(--muted)}


/* views */
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.back{cursor:pointer}
/* chat list (home) */
.h-top{grid-template-columns:64px 1fr 64px}
.h-top .lang{justify-self:start;margin:0 0 0 max(8px,env(safe-area-inset-left,0px))}
.h-icons{justify-self:end;display:flex;gap:14px;margin-right:max(14px,env(safe-area-inset-right,0px));color:#191919}
.h-icons svg{width:22px;height:22px}
.list{flex:1;min-height:0;overflow-y:auto;background:#fff}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:11px max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));background:#fff}
.item:active{background:#e8e8e8}
.item .pic{position:relative;flex:none;padding-bottom:11px}
.item .av{width:48px;height:48px;border-radius:6px}
.badge{position:absolute;top:-6px;right:-7px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--badge);color:#fff;font-size:11px;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding-bottom:11px;border-bottom:1px solid #ececec}
.item .l1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.item b{font-size:16px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item time{flex:none;font-size:12px;color:#b2b2b2}
.item .pv{font-size:14px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bar);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#191919;position:relative}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--go)}
.tab .badge{top:-3px;right:calc(50% - 22px)}
.stk-pv{font-size:14px}


/* ============ desktop: window with rail | chat list | conversation ============ */
.rail-me,.h-search,.empty-mark{display:none}
@media (min-width:900px) and (min-height:600px){
  body{display:flex;align-items:center;justify-content:center;background:#cfd2d4}
  .phone{display:grid;grid-template-columns:350px 1fr;width:min(1120px,96vw);height:min(780px,92vh);max-width:none;margin:0;border-radius:10px;box-shadow:0 24px 70px rgba(0,0,0,.22)}
  .view{min-width:0}
  #home{display:grid;grid-template-columns:60px 1fr;grid-template-rows:auto 1fr;background:#f7f7f7;border-right:1px solid #d6d6d6}
  #home[hidden]{display:none!important}
  .tabs{grid-column:1;grid-row:1/span 2;display:flex;flex-direction:column;align-items:center;gap:22px;background:#2e2e2e;border:0;padding:28px 0 0}
  .tab{color:#9a9a9a}
  .tab>span:not(.badge){display:none}
  .tab.on{color:var(--go)}
  .tab .badge{top:-6px;right:-10px}
  .rail-me{display:block;width:36px;height:36px;border-radius:5px;overflow:hidden;margin-bottom:6px}
  .rail-me img{display:block;width:100%;height:100%}
  .h-top{grid-column:2;display:flex;align-items:center;gap:10px;height:64px;padding:0 12px;background:#f7f7f7;border-bottom:1px solid #e2e2e2}
  .h-search{flex:1;min-width:0;order:1}
  .h-top .ttl,.h-icons svg:first-child{display:none}
  .h-search{display:flex;align-items:center;gap:6px;height:28px;border-radius:5px;background:#e2e2e2;color:#999;font-size:13px;padding:0 8px}
  .h-search svg{width:14px;height:14px}
  .h-top .lang{order:3;margin:0}
  .h-icons{margin:0;order:2}
  .list{grid-column:2;background:#f7f7f7}
  .item{background:transparent;padding:12px 14px}
  .item .pic,.item .txt{padding-bottom:0}
  .item .txt{border:0}
  .item .av{width:42px;height:42px}
  .item.sel{background:#dedede}
  .item:hover:not(.sel){background:#ececec}
  #chatview,#empty{grid-column:2;grid-row:1;position:relative;background:var(--chat)}
  .empty-mark{display:grid;place-items:center;flex:1;color:#d4d4d4}
  .empty-mark svg{width:84px;height:84px}
  .top{grid-template-columns:1fr auto;height:64px;padding:0 22px;border-bottom:1px solid #dcdcdc}
  .top .back{display:none}
  .ttl{text-align:left;font-size:18px}
  #chatview .top .lang{display:none}
  .chat{padding:20px 28px;gap:16px}
  .body{max-width:62%}
  .inbar{flex-wrap:wrap;align-items:flex-start;align-content:flex-start;height:170px;gap:6px 14px;background:var(--chat);border-top:1px solid #dcdcdc;padding:10px 22px 14px}
  .inbar>.ic:first-child{display:none}
  .inbar .ic{width:26px;height:26px}
  .inbar .ic svg{width:24px;height:24px}
  #emo{order:1}#plus{order:2}
  #plus[hidden]{display:grid!important}
  .inbar input{order:3;flex:1 0 100%;height:70px;background:transparent;padding:0;font-size:15px}
  .inbar input:focus-visible{outline:none}
  #send-txt,#send-txt[hidden]{order:4;display:block!important;margin-left:auto;background:#e9e9e9;color:#07c160;padding:7px 22px;font-size:14px}
  .panel{position:absolute;z-index:3;left:16px;bottom:176px;width:470px;height:330px;border:1px solid #dadada;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding-bottom:0;overflow:hidden}
  .cell{width:calc((100% - 50px) / 6)}
  .sheet{align-items:center;text-align:center}
  .sheet>*{width:min(360px,100%)}
}

/* end screen */
.sheet{position:absolute;inset:0;background:var(--chat);z-index:5;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:calc(24px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.sheet h1{margin:0;font-size:24px;font-weight:600}
.status{font-size:14px;color:#555;line-height:1.6;margin:0}
.status.err{color:#d93a3a}
.big{display:block;width:100%;background:#fff;color:var(--ink);border:1px solid var(--line);font-size:16px;padding:11px;border-radius:7px}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}.banner{transition:none}}
</style>
</head>
<body>
<div class="phone" id="phone">

  <div class="view" id="home">
    <header class="top h-top">
      <button class="lang" id="lang-home" type="button">EN</button>
      <div class="ttl" id="h-title"></div>
      <div class="h-search" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><span data-i18n="search"></span></div>
      <span class="h-icons" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></span>
    </header>
    <div class="list" id="list"></div>
    <nav class="tabs" aria-hidden="true">
      <span class="rail-me" id="rail-me"></span>
      <span class="tab on"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 016.5 4h13A2.5 2.5 0 0122 6.5v9a2.5 2.5 0 01-2.5 2.5H11l-5 4v-4h0A2.5 2.5 0 014 15.5z"/></svg><span data-i18n="tabChats"></span><span class="badge" id="tab-badge" hidden></span></span>
      <span class="tab"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="9" r="4"/><path d="M5 22c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span data-i18n="tabContacts"></span></span>
      <span class="tab"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="13" r="9"/><path d="M16.5 9.5l-2 5-5 2 2-5z"/></svg><span data-i18n="tabMoments"></span></span>
      <span class="tab"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="10" r="4.5"/><path d="M4.5 22a8.5 8.5 0 0117 0"/></svg><span data-i18n="tabMe"></span></span>
    </nav>
  </div>

  <div class="view" id="empty" hidden><div class="empty-mark" aria-hidden="true"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 016.5 4h13A2.5 2.5 0 0122 6.5v9a2.5 2.5 0 01-2.5 2.5H11l-5 4v-4h0A2.5 2.5 0 014 15.5z"/></svg></div></div>

  <div class="view" id="chatview" hidden>
  <header class="top">
      <button class="back" id="back" type="button" aria-label="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span class="unread" id="unread" hidden></span></button>
      <div class="ttl" id="t-name"></div>
      <button class="lang" id="lang" type="button">EN</button>
    </header>

    <main class="chat" id="chat"></main>

    <div class="inbar" id="inbar">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="14" cy="14" r="11.5"/><path d="M11 10.5a5 5 0 010 7M14.5 8a8.5 8.5 0 010 12" stroke-linecap="round"/></svg></span>
      <input id="txt" type="text" maxlength="80" autocomplete="off" aria-label="message">
      <button class="ic" id="emo" type="button" aria-pressed="false" aria-label="stickers"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="14" cy="14" r="11.5"/><circle cx="10.2" cy="11.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="17.8" cy="11.5" r="1.2" fill="currentColor" stroke="none"/><path d="M9.5 16.5c1.2 1.8 2.7 2.7 4.5 2.7s3.3-.9 4.5-2.7" stroke-linecap="round"/></svg></button>
      <button class="btn-send" id="send-txt" type="button" hidden></button>
      <span class="ic" id="plus" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="14" cy="14" r="11.5"/><path d="M14 9v10M9 14h10" stroke-linecap="round"/></svg></span>
    </div>

    <div class="panel" id="panel" hidden>
      <div class="p-tabs">
        <span class="p-tab on" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z" stroke-linejoin="round"/></svg></span>
        <span class="p-space"></span>
      </div>
      <div class="grid" id="grid"></div>
    </div>

  </div>

  <section class="sheet" id="done" hidden>
    <h1 data-i18n="doneTitle"></h1>
    <p class="status" id="save-note"></p>
    <button class="big" id="again" type="button" data-i18n="again"></button>
  </section>
</div>

<script>
/* ↓↓↓ Google Apps Script 部署后的网址 ↓↓↓ */

/* ============ 工具 ============ */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait=ms=>new Promise(r=>setTimeout(r,reduce?Math.min(ms,150):ms));
let lang="zh";
try{const l=localStorage.getItem("lang");if(l==="zh"||l==="en")lang=l;else if(!/^zh/i.test(navigator.language||""))lang="en"}catch(e){}
const t=(k,...a)=>{const v=I18N[lang][k];return typeof v==="function"?v(...a):v};
const tx=v=>v==null?"":(typeof v==="string"?v:(v[lang]||v.zh));
const PALETTE=["#7d9ac4","#c48a7d","#8fb07a","#b48ec4","#c4a96b","#6fb0b0","#c47d9e","#8a8fc4"];
function color(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length]}
function initial(nameObj){const s=tx(nameObj).replace(/^(室友|同事|小组作业)\s*/,"");const c=[...s][0]||"?";return /[a-z]/i.test(c)?c.toUpperCase():c}
let avMap={};
function assignAvatars(){const keys=new Set(["__me__"]);for(const s of round){keys.add(s.name.zh);for(const m of s.msgs)if(m.who)keys.add(m.who.zh)}
  const pics=shuffle(AVATARS.map((_,i)=>i));avMap={};[...keys].forEach((k,i)=>avMap[k]=pics[i%pics.length])}
const avSrc=k=>AVATARS[avMap[k]??0];
/* 有 av 文件名的联系人用 avatars/ 里的照片；加载失败就退回卡通头像 */
const EGG_EXT=[".jpg",".png",".webp",".jpeg"];
function avImg(nameObj,av){
  if(!av)return `<img src="${avSrc(nameObj.zh)}" alt="">`;
  return `<img src="avatars/${av}${EGG_EXT[0]}" data-k="${esc(nameObj.zh)}" data-av="${av}" data-x="0" alt="" onerror="avFail(this)">`;
}
function avFail(img){const x=+img.dataset.x+1;
  if(x<EGG_EXT.length){img.dataset.x=x;img.src="avatars/"+img.dataset.av+EGG_EXT[x]}
  else{img.onerror=null;img.src=avSrc(img.dataset.k)}}
const avHTML=(nameObj,av)=>`<div class="av">${avImg(nameObj,av)}</div>`;
const meAv=()=>`<div class="av"><img src="${avSrc("__me__")}" alt=""></div>`;
/* 实时部分 = 最后一段连续的对方消息 */
function liveStart(s){let i=s.msgs.length;while(i>0&&!s.msgs[i-1].me&&!s.msgs[i-1].t)i--;return i}

/* ============ 状态 ============ */
let round=[],cur=-1,answers=[],startedAt=0,sessionId="",runId=0,saveState=null;
let st={};   // st[id] = {opened, openedAt, answered, order(表情顺序), deepest(翻到第几张), listPos}
let order=[];                  // 列表顺序：回复过的对话会移到最上面

/* ============ 渲染 ============ */
function msgHTML(m,s){
  if(m.t)return `<div class="time">${esc(tx(m.t))}</div>`;
  if(m.me)return `<div class="row me">${meAv()}<div class="body"><div class="bub">${esc(tx(m))}</div></div></div>`;
  const who=m.who||s.name;
  let inner;
  if(m.link)inner=`<div class="bub card"><b>${esc(tx(m))}</b><span>${esc(tx(m.src))}</span></div>`;
  else if(m.loc)inner=`<div class="bub card"><b>${esc(tx(m))}</b><div class="map"></div></div>`;
  else inner=`<div class="bub">${esc(tx(m))}</div>`;
  return `<div class="row">${avHTML(who,m.who?m.who.av:s.av)}<div class="body">${s.group?`<div class="who">${esc(tx(who))}</div>`:""}${inner}</div></div>`;
}
const unreadOf=s=>st[s.id].opened?0:s.msgs.length-liveStart(s);
const totalUnread=(except)=>round.reduce((n,s)=>n+(s===except?0:unreadOf(s)),0);
function lastTime(s){for(let i=s.msgs.length-1;i>=0;i--)if(s.msgs[i].t)return tx(s.msgs[i].t);return ""}
function preview(s){
  const a=st[s.id].answered;
  if(a)return a.type==="sticker"?t("stkPv"):a.text;
  const m=s.msgs[s.msgs.length-1];
  const body=m.link||m.loc?"["+tx(m)+"]":tx(m);
  return (s.group&&m.who?tx(m.who)+": ":"")+body;
}
function renderHome(){
  $("h-title").textContent=t("chats")+(totalUnread()?` (${totalUnread()})`:"");
  $("list").innerHTML=order.map(i=>{const s=round[i],u=unreadOf(s),a=st[s.id].answered;
    return `<button class="item${i===cur?" sel":""}" type="button" data-i="${i}"><span class="pic"><div class="av">${avImg(s.name,s.av)}</div>${u?`<span class="badge">${u}</span>`:""}</span>
    <span class="txt"><span class="l1"><b>${esc(tx(s.name))}</b><time>${esc(a?t("now"):lastTime(s))}</time></span><span class="pv">${esc(preview(s))}</span></span></button>`}).join("");
  const tu=totalUnread();$("tab-badge").hidden=!tu;$("tab-badge").textContent=tu;
}
function renderChat(){
  const s=round[cur];if(!s)return;const a=st[s.id].answered;
  let h=s.msgs.map(m=>msgHTML(m,s)).join("");
  if(a)h+=`<div class="row me">${meAv()}<div class="body">${a.type==="sticker"?`<img class="stk" src="${imgSrc(a.id)}" alt="">`:`<div class="bub">${esc(a.text)}</div>`}</div></div>`;
  $("chat").innerHTML=h;
  $("chat").scrollTop=$("chat").scrollHeight;
  $("t-name").textContent=tx(s.name);
  const left=totalUnread(s);$("unread").hidden=!left;$("unread").textContent=left;
}
function applyLang(){
  document.documentElement.lang=lang==="en"?"en":"zh-CN";
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  $("lang").textContent=$("lang-home").textContent=t("langBtn");$("send-txt").textContent=t("send");
  if(round.length){renderHome();if(cur>=0)renderChat()}
  if(saveState)note(...saveState);
}
function toggleLang(){lang=lang==="zh"?"en":"zh";try{localStorage.setItem("lang",lang)}catch(e){}applyLang()}
$("lang").onclick=toggleLang;$("lang-home").onclick=toggleLang;

/* ============ 表情面板：点一下就发送 ============ */
/* 每个对话打开表情面板时，全部表情包重新随机排一次序 */
function renderGrid(S){
  $("grid").innerHTML=S.order.filter(id=>!bad.has(id)).map(id=>`<button class="cell" type="button" data-id="${id}"><img src="${imgSrc(id)}" alt="" loading="lazy" decoding="async"></button>`).join("");
  $("grid").scrollTop=0;
}
function fillGrid(){const S=st[round[cur].id];S.order=shuffle(IDS.filter(id=>!bad.has(id)));S.deepest=0;renderGrid(S)}
const canReply=()=>cur>=0&&!st[round[cur].id].answered;
/* 图片没传上去 / 加载失败：这一格直接去掉，之后也不再出现 */
const bad=new Set();
$("grid").addEventListener("error",e=>{
  const img=e.target;if(img.tagName!=="IMG")return;
  const cell=img.closest(".cell");if(!cell)return;
  bad.add(cell.dataset.id);cell.remove();
},true);
/* 记录参与者往下翻到了第几张 */
$("grid").addEventListener("scroll",()=>{
  if(cur<0)return;const g=$("grid"),c=g.querySelector(".cell");if(!c)return;
  const cols=Math.max(1,Math.round(g.clientWidth/(c.offsetWidth+10)));
  const rows=Math.ceil((g.scrollTop+g.clientHeight)/(c.offsetHeight+10));
  const S=st[round[cur].id];S.deepest=Math.max(S.deepest||0,Math.min(rows*cols,g.children.length));
},{passive:true});
$("grid").onclick=e=>{const c=e.target.closest(".cell");if(!c)return;
  const pos=[...$("grid").children].indexOf(c)+1;reply({type:"sticker",id:c.dataset.id,pos})};
function openPanel(open){
  if(open&&!st[round[cur].id].order)fillGrid();
  $("panel").hidden=!open;$("emo").setAttribute("aria-pressed",open?"true":"false");
  if(open){const g=$("grid"),c=g.querySelector(".cell"),S=st[round[cur].id];
    if(c&&!S.deepest){const cols=Math.max(1,Math.round(g.clientWidth/(c.offsetWidth+10)));S.deepest=Math.min(Math.ceil(g.clientHeight/(c.offsetHeight+10))*cols,g.children.length)}}
  setTimeout(()=>$("chat").scrollTop=$("chat").scrollHeight,0);
}
$("emo").onclick=()=>{if(canReply())openPanel($("panel").hidden)};

/* 打字回复 */
$("txt").oninput=()=>{const has=$("txt").value.trim().length>0;$("send-txt").hidden=!has;$("plus").hidden=has};
$("txt").onfocus=()=>openPanel(false);
$("txt").onkeydown=e=>{if(e.key==="Enter")$("send-txt").click()};
$("send-txt").onclick=()=>{const v=$("txt").value.trim();if(v&&canReply())reply({type:"text",text:v})};

/* ============ 布局：手机一次显示一屏；电脑上列表和对话并排 ============ */
const desk=matchMedia("(min-width:900px) and (min-height:600px)");
function layout(){
  if(desk.matches){$("home").hidden=false;$("chatview").hidden=cur<0;$("empty").hidden=cur>=0}
  else{$("empty").hidden=true;$("home").hidden=cur>=0;$("chatview").hidden=cur<0}
}
desk.addEventListener?desk.addEventListener("change",layout):desk.addListener(layout);

/* ============ 流程 ============ */
$("list").onclick=e=>{const it=e.target.closest(".item");if(it)openChat(+it.dataset.i)};
function openChat(i){
  const my=++runId;cur=i;const s=round[i],S=st[s.id];
  if(!S.opened){S.opened=true;S.openedAt=Date.now();S.listPos=order.indexOf(i)+1}
  $("txt").value="";$("send-txt").hidden=true;$("plus").hidden=false;
  const locked=!!S.answered;$("txt").disabled=locked;$("emo").disabled=locked;
  $("panel").hidden=true;$("emo").setAttribute("aria-pressed","false");
  layout();renderChat();renderHome();
  if(!locked){
    if(S.order)renderGrid(S);else $("grid").innerHTML="";
    wait(900).then(()=>{if(my===runId&&canReply())openPanel(true)});
  }
}
function goHome(){runId++;cur=-1;layout();renderHome();if(!desk.matches)$("list").scrollTop=0}
$("back").onclick=goHome;
function reply(r){
  if(!canReply())return;
  const s=round[cur],S=st[s.id];S.answered=r;
  answers.push({scenario_id:s.id,contact:s.name.zh,easter_egg:s.egg?1:0,reply_type:r.type,sticker_id:r.id||"",original_file:r.id?ORIG[r.id]:"",
    text:r.text||"",list_position:S.listPos,sticker_position:r.pos||"",deepest_seen:S.deepest||0,panel_size:S.order?S.order.filter(id=>!bad.has(id)).length:0,ms:Date.now()-S.openedAt});
  order=[cur,...order.filter(x=>x!==cur)];
  $("panel").hidden=true;$("emo").setAttribute("aria-pressed","false");
  $("txt").value="";$("txt").blur();$("send-txt").hidden=true;$("plus").hidden=false;$("txt").disabled=true;$("emo").disabled=true;
  renderChat();renderHome();
  if(answers.length===round.length)setTimeout(finish,1800);
}
function start(){
  {let r=Math.random(),k=0;for(;k<EGG_WEIGHTS.length-1;k++){if(r<EGG_WEIGHTS[k])break;r-=EGG_WEIGHTS[k]}
   const eggPick=shuffle(EGGS).slice(0,k);
   const seen=new Set();const normal=shuffle(SCENES).filter(x=>!seen.has(x.name.zh)&&seen.add(x.name.zh)).slice(0,PER_ROUND-eggPick.length);   // 同一个人一轮只出现一次
   round=shuffle([...normal,...eggPick])}
  order=round.map((_,i)=>i);st={};round.forEach(s=>st[s.id]={opened:false,openedAt:0,answered:null,order:null,deepest:0,listPos:0});
  answers=[];startedAt=Date.now();sessionId=startedAt.toString(36)+Math.random().toString(36).slice(2,6);
  saveState=null;assignAvatars();$("rail-me").innerHTML=`<img src="${avSrc("__me__")}" alt="">`;
  $("done").hidden=true;goHome();
}
function note(...a){saveState=a;const el=$("save-note");el.textContent=t(...a);el.classList.toggle("err",a[0]==="saveFail")}
let finished=false;
async function finish(){
  if(finished)return;finished=true;
  $("done").hidden=false;
  const session={id:sessionId,lang,startedAt:new Date(startedAt).toISOString(),finishedAt:new Date().toISOString(),ua:navigator.userAgent,answers};
  if(SCRIPT_URL.startsWith("PASTE")){note("saveFail","SCRIPT_URL");return}
  note("saving");
  try{
    await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(session)});
    note("saved");
  }catch(e){note("saveFail",e.message||"network")}
}
$("again").onclick=()=>{finished=false;start()};

applyLang();
start();
</script>
</body>
</html>
